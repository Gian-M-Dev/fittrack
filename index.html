<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1322">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitTrack">
  <meta name="description" content="Dein privates Trainingstagebuch mit Fortschritten und Ernährung. Kostenlos und offline.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>FitTrack – Mein Training</title>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand"><span class="brand-mark">F<span class="brand-dot">.</span></span><div><div class="brand-name">FitTrack</div><div class="brand-sub">DEIN TRAINING. DEIN FORTSCHRITT.</div></div></div>
      <span class="header-pill" id="networkPill" aria-live="polite">● Lokal gespeichert</span>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button class="nav-item active" data-nav="training" type="button"><span class="nav-icon">▦</span><span>Training</span></button>
      <button class="nav-item" data-nav="progress" type="button"><span class="nav-icon">↗</span><span>Verlauf</span></button>
      <button class="nav-item" data-nav="food" type="button"><span class="nav-icon">◉</span><span>Ernährung</span></button>
      <button class="nav-item" data-nav="settings" type="button"><span class="nav-icon">⚙</span><span>Mehr</span></button>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
