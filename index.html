<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#09131f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitTrack">
  <meta name="description" content="Dein privates Krafttrainingstagebuch mit Übungen, Timer und Analysen.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=2.0.0">
  <title>FitTrack – Training & Fortschritt</title>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand"><span class="brand-mark">F<span class="brand-dot">.</span></span><div><div class="brand-name">FitTrack <span class="version">2.0</span></div><div class="brand-sub">DEIN TRAINING. DEINE DATEN.</div></div></div>
      <span class="header-pill">● Privat & lokal</span>
    </header>
    <main id="app"></main>
    <div id="timerDock" class="timer-dock hidden" aria-live="polite"></div>
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button type="button" class="nav-item active" data-nav="training"><span class="nav-icon">▦</span><span>Training</span></button>
      <button type="button" class="nav-item" data-nav="library"><span class="nav-icon">⊞</span><span>Übungen</span></button>
      <button type="button" class="nav-item" data-nav="stats"><span class="nav-icon">↗</span><span>Statistik</span></button>
      <button type="button" class="nav-item" data-nav="food"><span class="nav-icon">◉</span><span>Essen</span></button>
      <button type="button" class="nav-item" data-nav="settings"><span class="nav-icon">⚙</span><span>Mehr</span></button>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <!-- Verhindert versehentliches Zwei-Finger-Zoomen auf dem iPhone, aber nicht normales Scrollen. -->
  <script>
    document.addEventListener('gesturestart', function (event) { event.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (event) { event.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function (event) {
      if (event.touches && event.touches.length > 1) event.preventDefault();
    }, { passive: false });
  </script>
  <script src="./app.js?v=2.0.0" defer></script>
</body>
</html>
